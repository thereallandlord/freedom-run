name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:mech
      # Ключи Supabase — из секретов репозитория: без них сборка живая,
      # но онлайн-комнаты уйдут в локальный режим (вкладки одного браузера).
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # 🔴 Копия на GitHub Pages — это только страница, сервера там нет.
          # Поэтому за разбором и кабинетом она ходит на наш сервер по адресу.
          # Кому он недоступен — всё равно играет: и разбор, и кабинет
          # написаны так, что молчание сервера ничего не ломает.
          VITE_API_BASE: https://cashflow.craftopen.space
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
