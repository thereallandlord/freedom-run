<!doctype html>
<html lang="ru" class="h-full" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <!--
      🔴 Просим браузер не держать саму страницу: файлы сборки лежат под
      хэшами и кэшируются как угодно долго, а вот index.html обязан быть
      свежим — иначе Safari неделями подсовывает старую игру.
    -->
    <meta http-equiv="Cache-Control" content="no-cache, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Cashflow, версия GreenLeaf — настольная игра про личные финансы: вырваться из денежной рутины и жить на пассивный доход." />
    <meta name="theme-color" content="#f7f6f2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!--
      Значок вкладки. SVG понимают все нынешние браузеры; Safari до 17 и
      старый Edge берут PNG, поэтому лежат оба. apple-touch-icon нужен для
      «на экран Домой» на айфоне — там SVG не принимается вовсе.
    -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="alternate icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./site.webmanifest" />
    <title>Cashflow · GreenLeaf version</title>
    <script>
      // Ставим тему ДО первой отрисовки, иначе на секунду мигнёт светлым у тех,
      // кто выбрал тёмную. Ключ обязан совпадать с THEME_STORAGE_KEY в src/ui/theme.ts.
      ;(function () {
        try {
          var t = localStorage.getItem('freedom-run:theme')
          if (t !== 'dark' && t !== 'light') t = 'light'
          document.documentElement.setAttribute('data-theme', t)
          document.documentElement.style.colorScheme = t
          var m = document.querySelector('meta[name="theme-color"]')
          if (m) m.setAttribute('content', t === 'dark' ? '#0b0d12' : '#f7f6f2')
        } catch (e) {
          /* приватный режим без localStorage — остаёмся на светлой */
        }
      })()
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
